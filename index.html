<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Murojaat Yuborish</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        h3 { text-align: center; margin-top: 10px; }
        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
            box-sizing: border-box;
            resize: none;
            font-size: 14px;
            margin-bottom: 15px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h3>✍️ Murojaat yuborish</h3>
    <textarea id="murojaatText" placeholder="Murojaatingizni batafsil yozing..."></textarea>
    <button onclick="sendMurojaat()">Yuborish</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // SOZLAMALAR
        const BOT_TOKEN = 8640905839:AAEpKhu9HHL-dp9qMe2Ivm_NcU3ef9oRB7c;
        const ADMIN_ID = 8640905839;

        async function sendMurojaat() {
            const text = document.getElementById('murojaatText').value.trim();
            if (!text) {
                alert("Iltimos, xabaringizni yozing!");
                return;
            }

            const user = tg.initDataUnsafe?.user;
            const userName = user ? `${user.first_name} ${user.last_name || ''}` : "Noma'lum";
            const userHandle = user?.username ? `@${user.username}` : "yo'q";
            const userId = user?.id || "Noma'lum";

            const caption = `📩 <b>Yangi Murojaat!</b>\n\n👤 <b>Kimdan:</b> ${userName}\n<b>Username:</b> ${userHandle}\n<b>ID:</b> <code>${userId}</code>\n\n💬 <b>Xabar:</b>\n${text}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_ID,
                        text: caption,
                        parse_mode: 'HTML'
                    })
                });

                alert("Murojaatingiz adminga yetkazildi!");
                tg.close();
            } catch (error) {
                alert("Xatolik yuz berdi. Qaytadan urinib ko'ring.");
            }
        }
    </script>
</body>
</html>
